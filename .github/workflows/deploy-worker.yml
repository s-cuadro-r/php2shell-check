name: Desplegar Worker propio (Cloudflare)

# Se dispara solo a mano, desde la pestaña Actions de este repo (botón "Run workflow").
# No requiere ninguna máquina local: corre enteramente en los servidores de GitHub.
#
# Requisitos previos (una sola vez, todo desde el navegador):
#   1. Cuenta gratuita en https://dash.cloudflare.com/sign-up
#   2. Entrar una vez a Workers & Pages en el dashboard de Cloudflare para
#      confirmar un subdominio *.workers.dev (lo pide la primera vez, gratis).
#   3. Crear un token: My Profile -> API Tokens -> Create Token ->
#      plantilla "Edit Cloudflare Workers" -> Continue -> Create Token.
#   4. Cargar ese token como secreto de este repo:
#      Settings -> Secrets and variables -> Actions -> New repository secret
#        Nombre: CLOUDFLARE_API_TOKEN
#      (Opcional, solo si el deploy pide elegir cuenta) Nombre: CLOUDFLARE_ACCOUNT_ID
#      Valor: lo mostrado en el dashboard de Cloudflare, sección Workers, barra lateral.
#
# El resultado (la URL del Worker ya desplegado) queda escrito al final del
# resumen de la ejecución, en la pestaña Actions de GitHub.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Desplegar el Worker con Wrangler
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev[^ ]*' deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "No se pudo detectar la URL en la salida de wrangler. Revisá el log completo arriba." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "## Worker desplegado"
            echo ""
            echo "URL: \`$URL\`"
            echo ""
            echo "Pegá esta URL en el chat con Claude para que la cargue en \`checker.js\` (\`SELF_HOSTED_ENDPOINT\`) y publique el cambio."
          } >> "$GITHUB_STEP_SUMMARY"
